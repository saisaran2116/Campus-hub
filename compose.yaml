services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: campus_hub
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus-local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - campus-postgres:/var/lib/postgresql/data
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27029:27017"
    volumes:
      - campus-mongo:/data/db
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
  app:
    profiles: ["production-smoke"]
    build: .
    environment:
      DATABASE_URL: postgresql://campus:campus-local@postgres:5432/campus_hub
      MONGODB_URI: mongodb://mongo:27017/campus_hub
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-}
      DEMO_MODE: "false"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3010
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:3010:3005"
    depends_on: [postgres, mongo, redis]
volumes:
  campus-postgres:
  campus-mongo:
